name: Validate Canvas candidate

on:
  workflow_call:
    inputs:
      candidate:
        description: Restore and validate the release candidate artifact
        type: boolean
        default: false
      major_version:
        description: The exact major a human authorized on the calling dispatch (empty for every automatic run)
        type: string
        default: ''

permissions:
  contents: read

env:
  HUSKY: '0'
  # Lets a human-authorized major candidate pass the version assertion when the
  # candidate is restored; empty otherwise, so a major candidate can only ever exist
  # on an explicit dispatch of the deploy workflow.
  RELEASE_MAJOR: ${{ inputs.major_version }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download candidate
        if: inputs.candidate
        uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate

      - name: Restore the exact version candidate
        if: inputs.candidate
        run: node scripts/release.mjs restore "$RUNNER_TEMP/candidate"
        env:
          SOURCE_SHA: ${{ github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # setup-bun does not cache installs. Bun's global content-addressable download
      # cache serves BOTH the root and docs installs, so one entry covers them.
      - name: Cache bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'docs/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Playwright transpiles TypeScript without type-checking it, and the root
      # project includes only src/**, so without this the whole e2e tree would ship
      # its type errors to runtime.
      - name: Typecheck the end-to-end suite
        run: bun run typecheck:e2e

      # One flat config at the repo root covers every hand-written source tree, the docs
      # app included, so this single run is the real lint gate. The docs workspace runs
      # its own script further down for a different reason (see there).
      - name: Lint
        run: bun run lint

      - name: Build Canvas and optional Android module (dist)
        run: bun run build

      - name: Verify both package artifacts
        run: bun run verify-package

      - name: Unit tests
        run: bun run test

      - name: Validate interaction evidence registry
        run: bun scripts/check-interaction-coverage.ts

      - name: Validate material coverage against public exports and docs
        run: bun run check:materials

      # Runs docgen ONCE for the whole pipeline and fails on ANY drift under
      # docs/src/core (tracked or untracked), so a breaking prop change or a forgotten
      # `bun run docs:gen` is caught here, and the docs steps below consume a validated
      # docs core with no rerun.
      - name: Check generated docs core is up to date
        run: bun run docs:gen:check

      # Coverage gate for the native iOS menu glyph rasters: every nav glyph must have a
      # bundled PNG + map entry, so a forgotten `bun run raster:gen` after a nav-icon change
      # is caught. Coverage only (not PNG bytes), since sharp output can differ macOS<->CI.
      - name: Check menu-glyph rasters are up to date
        run: bun run raster:gen:check

      # DESIGN.md is the kit's own design system, written for the agents and people
      # building on it. Its frontmatter and token tables are generated from
      # src/style/tokens.ts and styles/tokens, so a token change that skips the
      # generator would leave the document describing the previous release.
      - name: Check DESIGN.md is up to date
        run: bun run designmd:gen:check

      - name: Validate theme tokens
        run: bun run validate-tokens

      - name: Check parity with the design hand-off
        run: bun run check-parity:check

      # Compares every semantic colour token with the Figma variable it derives from (the
      # vendored Riskora export under tools/figma). The other colour guards compare files that
      # both live behind this commit, so they can only prove the kit is internally consistent;
      # this one reads the design source. The export is a snapshot too: re-read the variables
      # from the Figma file when the kit changes, since that refresh is the real check.
      - name: Check colour tokens against the Figma variables
        run: bun run check-figma

      - name: Check CSS + JS size budgets
        run: bun run check-size

      # --- Docs app (the universal RN app the Pages deploy ships) ---

      # The docs resolve the kit from src through their postinstall link and Metro resolver.
      - name: Install docs deps
        working-directory: docs
        run: bun install --frozen-lockfile

      # The /licenses screen carries obligations, not decoration: MIT requires its notice
      # to ship with the software and OFL-1.1 requires the same for the bundled Geist
      # typefaces. This fails if a dependency changed without re-running `notices:gen`,
      # so the notices cannot fall silently out of step with what the app ships. It reads
      # tools/noticegen/shipped.json and never runs an export, so it stays CI-fast.
      #
      # MUST run after the docs install: the generator reads each package's LICENSE from
      # docs/node_modules first and the workspace root second. With docs deps absent it
      # resolves a different set and reports a false "stale", which is exactly how it
      # failed the first time it ran here.
      - name: Check third-party licence notices are up to date
        run: bun run notices:gen:check

      # The root Lint step above already lints docs/src. This runs the docs workspace's
      # OWN script, which is the only thing that catches it breaking: `expo lint` hands
      # ESLint the docs/src path, and ESLint 9 exits 2 when every path it is handed is
      # ignored. That is exactly how this script sat broken and unnoticed, since nothing
      # in CI ever invoked it.
      - name: Lint docs workspace script
        working-directory: docs
        run: bun run lint

      # The single nav source of truth (nav.config.json) must stay 1:1 with the
      # generated docs core data.
      - name: Check nav config is in sync
        working-directory: docs
        run: bun run check:nav

      # A component that ships per-OS skins must be in the docs' platform-skin
      # registry, or the three-up preview renders the web build in all three rows
      # while labelling two of them iOS and Android.
      - name: Check the platform-skin registry covers every divergent skin
        working-directory: docs
        run: bun run check:skins

      # docs/tsconfig.json includes docs/src/core/** and maps @ionizeio/canvas to
      # ../src/index.ts, so this also typechecks every generated example against the
      # real component prop types.
      - name: Typecheck docs (includes generated examples)
        working-directory: docs
        run: bun run typecheck

      # Kept per-push: it is the only check that catches CI-only Metro/export bugs
      # before a Pages deploy trips over them. `build:web` is what deploy.yml runs, so
      # this exercises the shipping configuration exactly, including the three
      # post-processors (inlined stylesheet, Pages preparation, paint-first loader)
      # that `expo export` alone never reaches. It used to export under EXPO_BASE_URL=/canvas to match a Pages
      # deploy that no longer exists: deploy.yml sets no base URL, since the site is
      # served from the root of canvas.nannier.com, so CI was validating a build nobody
      # ships. Node comes from the runner image.
      - name: Export web build
        working-directory: docs
        run: bun run build:web
        env:
          SOURCE_SHA: ${{ github.sha }}

      - name: Identify the non-publication candidate
        if: ${{ !inputs.candidate }}
        run: node scripts/release.mjs prepare "$RUNNER_TEMP/candidate"
        env:
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_NPM: 'false'

      - name: Upload the non-publication candidate identity
        if: ${{ !inputs.candidate }}
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate
          retention-days: 7
          if-no-files-found: error

      - name: Seal the tested artifacts
        run: node scripts/release.mjs seal "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/artifacts"

      # The consumer-support check renders the web floor in headless Chromium
      # (scripts/verify-consumer-support.mjs). It used to ride on the browser the
      # rendered-colour check installed above; that check left with the Riskora
      # restyle, so the browser is installed here in its own right. Same cache key
      # as the e2e job: the lockfile pins the Playwright build.
      - name: Cache the Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium for the consumer-support check
        run: bunx playwright install --with-deps chromium

      - name: Verify declared React and React Native support with the sealed package
        run: bun run verify-consumer-support --artifacts "$RUNNER_TEMP/artifacts"

      - name: Upload sealed release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: ${{ runner.temp }}/artifacts
          retention-days: 7
          if-no-files-found: error

  native:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    uses: ./.github/workflows/native-smoke.yml
    with:
      platform: ${{ matrix.platform }}

  # Partition the full browser suite while keeping each shard on the same sealed
  # candidate. All shards gate the reusable workflow and therefore publication;
  # fail-fast=false preserves the other engines' evidence after a failure.
  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download candidate
        uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate

      - name: Restore the exact version candidate
        run: node scripts/release.mjs restore "$RUNNER_TEMP/candidate"
        env:
          SOURCE_SHA: ${{ github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # The same key as `check`: bun's download cache is content-addressable, so one
      # entry serves both jobs.
      - name: Cache bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'docs/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # The lockfile selects all three engine builds. Focused keyboard and touch
      # journeys complement the full Chromium suite without duplicating baselines.
      - name: Cache the Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium, Firefox and WebKit
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Download sealed artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: ${{ runner.temp }}/artifacts

      - name: Verify and extract the sealed docs
        run: |
          node scripts/release.mjs verify "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/artifacts"
          mkdir -p docs/dist
          tar -xzf "$RUNNER_TEMP/artifacts/docs.tgz" -C docs/dist

      - name: End-to-end suite
        run: bunx playwright test --shard=${{ matrix.shard }}/4 --reporter=github,html

      - name: Upload the shard's Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # This is an independent registry consumer. Passing library checks gate it,
  # but it builds its own app and never installs the sealed candidate package.
  starter:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'docs/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Cache the Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium, Firefox and WebKit
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Install the ordinary starter's pinned registry dependencies
        working-directory: examples/starter
        run: bun install --frozen-lockfile

      - name: Typecheck and export the ordinary starter
        working-directory: examples/starter
        run: |
          bun run typecheck
          bun run build:web
        env:
          EXPO_PUBLIC_CANVAS_SMOKE: '0'

      - name: Verify starter user journeys across browser engines and touch
        run: bunx playwright test --config e2e/starter/playwright.config.ts

      - name: Upload the starter's Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-starter
          path: |
            playwright-report/starter/
            test-results/starter/
          retention-days: 7
